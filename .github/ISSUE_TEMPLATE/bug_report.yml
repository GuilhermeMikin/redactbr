name: Bug report
description: Something does not work as the README or the specification says.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. **Never paste real personal data** (CPF, CNPJ, emails, logs from
        production); reproduce the problem with generated values instead. Security problems must not go
        here: report them privately as described in
        [SECURITY.md](https://github.com/GuilhermeMikin/redactbr/blob/main/SECURITY.md).
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What you expected, and what RedactBR did instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: A short Go program or test, with generated values only.
      render: go
    validations:
      required: true
  - type: dropdown
    id: policy
    attributes:
      label: Policy
      options:
        - Balanced (default)
        - Strict
        - Not related to detection
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: RedactBR commit or version
      placeholder: "a1b2c3d"
    validations:
      required: true
  - type: input
    id: go
    attributes:
      label: Go version
      description: The output of `go version`.
      placeholder: go1.27.3 linux/amd64
    validations:
      required: true
