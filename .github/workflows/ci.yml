# The checks from the "Definition of done" in CLAUDE.md, on every push to main and every pull request.
# Actions are pinned to full commit SHAs; Dependabot (.github/dependabot.yml) keeps them current.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Use exactly the Go version installed by setup-go; never download another toolchain.
  GOTOOLCHAIN: local

jobs:
  test:
    name: Test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The supported Go releases (go.dev/doc/devel/release); go.mod requires the older one.
        go: ["1.26.x", "1.27.x"]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: false # no module dependencies to cache

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "gofmt would change:"; echo "$unformatted"; exit 1; fi

      - name: go vet
        run: go vet ./...

      - name: Tests (including fuzz seeds and godoc examples)
        run: go test ./...

      - name: Race detector
        run: go test -race ./...

      - name: Examples
        run: |
          go run ./examples/basic
          go run ./examples/llm-stream

      # One iteration each: keeps the benchmarks compiling and running; timings on shared runners are noise.
      - name: Benchmarks (smoke)
        run: go test -run='^$' -bench=. -benchtime=1x ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          cache: false

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

  vuln:
    name: Vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          cache: false

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  fuzz:
    name: Fuzz (short)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          cache: false

      # Every fuzz target for 10 seconds. Longer runs happen locally (make fuzz FUZZTIME=…).
      - name: Fuzz targets
        run: make fuzz FUZZTIME=10s

      # A failing input is written to testdata/fuzz/<FuzzName>/; print it so the failure can be reproduced
      # by saving it under the same path locally. Fuzz inputs are generated, never real data.
      - name: Print new fuzz failures
        if: failure()
        run: |
          git status --porcelain --untracked-files=all | awk '$1 == "??" {print $2}' | grep 'testdata/fuzz/' |
            while read -r f; do echo "== $f"; cat "$f"; echo; done
