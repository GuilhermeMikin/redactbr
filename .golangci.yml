version: "2"

linters:
  # errcheck, govet, ineffassign, staticcheck and unused, plus a few that catch real bugs in a parsing and
  # security-oriented library. Style-only linters are left out on purpose.
  default: standard
  enable:
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nolintlint
    - revive
    - unconvert
    - unparam
    - usestdlibvars
  settings:
    misspell:
      locale: US
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    presets:
      - std-error-handling
    rules:
      # Tests and examples may print to stdout and use math/rand for property tests.
      - path: (_test\.go|^examples/)
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
